<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>План по штрафам</title><desc>Аналитик сравнивает карту аварий и карту денежных поступлений.</desc><defs><linearGradient id="sky" x2=".6" y2="1"><stop stop-color="#172e56"/><stop offset=".68" stop-color="#638aa6"/><stop offset="1" stop-color="#f9ba88"/></linearGradient></defs><style>.water{animation:drift 5s ease-in-out infinite}.pulse{animation:breathe 3s ease-in-out infinite}.move{animation:nudge 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.snow{animation:fall 5s linear infinite}@keyframes drift{50%{transform:translate(7px,2px);opacity:.72}}@keyframes breathe{50%{opacity:.55}}@keyframes nudge{50%{transform:translate(4px,-3px)}}@keyframes fall{50%{transform:translate(-5px,11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="800" height="450" fill="url(#sky)"/><rect x="48" y="45" width="704" height="320" rx="8" fill="#667f97" stroke="#172e4e" stroke-width="4"/><path d="M0 333Q320 289 800 334V450H0Z" fill="#345574" stroke="#172e4e" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="137" y="112" width="228" height="174" rx="8" fill="#506f88" stroke="#172e4e" stroke-width="4"/><rect x="427" y="112" width="224" height="174" rx="8" fill="#506f88" stroke="#172e4e" stroke-width="4"/><path d="M164 254 181 170 211 260 234 219 272 141 301 202 338 173" fill="none" stroke="#f87964" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M452 251 481 225 515 215 548 197 582 160 625 144" fill="none" stroke="#ffcf69" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class=""/><g transform="translate(391 268) scale(0.83)"><g class="move"><ellipse cx="0" cy="115" rx="40" ry="9" fill="#172e4e" opacity=".22"/><path d="M-13 63-19 104M13 63 23 104" fill="none" stroke="#172e4e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M-29 61V23Q-24-7 0-8Q26-6 29 22V61Z" fill="#60c7b7" stroke="#172e4e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M-20 28-53 6M20 28 53-7" fill="none" stroke="#60c7b7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" class=""/><circle cy="-44" r="23" fill="#edb68e" stroke="#172e4e" stroke-width="4"/><path d="M-25-42Q-32-70 0-70Q32-69 26-32L18-45Q0-51-19-43Z" fill="#31405d" stroke="#172e4e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><circle cx="-8" cy="-43" r="2.5" fill="#172e4e"/><circle cx="8" cy="-43" r="2.5" fill="#172e4e"/><path d="M-5-31Q0-28 5-31" fill="none" stroke="#172e4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><text x="169" y="145" font-size="18" font-weight="800" fill="#fff0d0" font-family="sans-serif">Аварии</text><text x="452" y="145" font-size="18" font-weight="800" fill="#fff0d0" font-family="sans-serif">Поступления</text><path d="M143 310H653V332H143Z" fill="#b77b61" stroke="#172e4e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M167 332V413M629 332V413" fill="none" stroke="#805742" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M4 4H796V446H4Z" fill="none" stroke="#fff5dc" stroke-width="8" opacity=".15"/></svg>