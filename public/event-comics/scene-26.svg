<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>Курс после закрытия цеха</title><desc>Токарь стоит у остановленного станка с учебным буклетом.</desc><defs><linearGradient id="sky" x2=".6" y2="1"><stop stop-color="#172e56"/><stop offset=".68" stop-color="#638aa6"/><stop offset="1" stop-color="#f9ba88"/></linearGradient></defs><style>.water{animation:drift 5s ease-in-out infinite}.pulse{animation:breathe 3s ease-in-out infinite}.move{animation:nudge 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.snow{animation:fall 5s linear infinite}@keyframes drift{50%{transform:translate(7px,2px);opacity:.72}}@keyframes breathe{50%{opacity:.55}}@keyframes nudge{50%{transform:translate(4px,-3px)}}@keyframes fall{50%{transform:translate(-5px,11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="800" height="450" fill="url(#sky)"/><rect x="48" y="45" width="704" height="320" rx="8" fill="#667f97" stroke="#172e4e" stroke-width="4"/><path d="M0 333Q320 289 800 334V450H0Z" fill="#345574" stroke="#172e4e" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="93" y="186" width="282" height="116" rx="8" fill="#52737f" stroke="#172e4e" stroke-width="4"/><circle cx="297" cy="226" r="31" fill="#adc3c8" stroke="#172e4e" stroke-width="5"/><path d="M111 196H210V257H111ZM174 120V189" fill="#60c7b7" stroke="#172e4e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class=""/><g transform="translate(442 262) scale(0.9)"><g class="move"><ellipse cx="0" cy="115" rx="40" ry="9" fill="#172e4e" opacity=".22"/><path d="M-13 63-19 104M13 63 23 104" fill="none" stroke="#172e4e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M-29 61V23Q-24-7 0-8Q26-6 29 22V61Z" fill="#fff0d0" stroke="#172e4e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M-20 28-53 6M20 28 53-7" fill="none"