<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>Звук сирены не дошёл</title><desc>Диспетчер смотрит на зелёную панель системы оповещения.</desc><defs><linearGradient id="sky" x2=".6" y2="1"><stop stop-color="#172e56"/><stop offset=".68" stop-color="#638aa6"/><stop offset="1" stop-color="#f9ba88"/></linearGradient></defs><style>.water{animation:drift 5s ease-in-out infinite}.pulse{animation:breathe 3s ease-in-out infinite}.move{animation:nudge 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.snow{animation:fall 5s linear infinite}@keyframes drift{50%{transform:translate(7px,2px);opacity:.72}}@keyframes breathe{50%{opacity:.55}}@keyframes nudge{50%{transform:translate(4px,-3px)}}@keyframes fall{50%{transform:translate(-5px,11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="800" height="450" fill="url(#sky)"/><path d="M0 208 130 142 244 217 374 159 570 205 702 154 800 198V355H0Z" fill="#526d87" opacity=".45"/><path d="M0 333Q320 289 800 334V450H0Z" fill="#345574" stroke="#172e4e" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="108" y="126" width="215" height="164" rx="10" fill="#1d4561" stroke="#172e4e" stroke-width="4"/><path d="M215.5 290V314M170.5 315H260.5" fill="none" stroke="#172e4e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" class=""/><text x="133" y="191" font-size="46" font-weight="800" fill="#60c7b7" font-family="sans-serif">●</text><circle cx="149" cy="229" r="10" fill="#60c7b7" class="pulse"/><circle cx="203" cy="229" r="10" fill="#60c7b7" class="pulse"/><circle cx="257" cy="229" r="10" fill="#60c7b7" class="pulse"/><g transform="translate(372 283) scale(0.8)"><g class="move"><ellipse cx="0" cy="115" rx="40" ry="9" fill="#172e4e" opacity=".22"/><path d="M-13 63-19 104M13 63 23 104" fill="none" stroke="#172e4e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" class="