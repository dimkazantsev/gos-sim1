<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>Стипендия с чужим адресом</title><desc>Студентка держит документ о новом адресе возле списка стипендиатов.</desc><defs><linearGradient id="sky" x2=".6" y2="1"><stop stop-color="#172e56"/><stop offset=".68" stop-color="#638aa6"/><stop offset="1" stop-color="#f9ba88"/></linearGradient></defs><style>.water{animation:drift 5s ease-in-out infinite}.pulse{animation:breathe 3s ease-in-out infinite}.move{animation:nudge 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.snow{animation:fall 5s linear infinite}@keyframes drift{50%{transform:translate(7px,2px);opacity:.72}}@keyframes breathe{50%{opacity:.55}}@keyframes nudge{50%{transform:translate(4px,-3px)}}@keyframes fall{50%{transform:translate(-5px,11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="800" height="450" fill="url(#sky)"/><rect x="48" y="45" width="704" height="320" rx="8" fill="#667f97" stroke="#172e4e" stroke-width="4"/><path d="M0 333Q320 289 800 334V450H0Z" fill="#345574" stroke="#172e4e" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="369" y="123" width="282" height="175" rx="8" fill="#fff0d0" stroke="#172e4e" stroke-width="4"/><text x="398" y="159" font-size="22" font-weight="800" fill="#172e4e" font-family="sans-serif">Стипендии</text><path d="M394 183H623" fill="none" stroke="#6d8f9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M394 206H623" fill="none" stroke="#6d8f9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M394 229H623" fill="none" stroke="#6d8f9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M394 252H623" fill="none" stroke="#6d8f9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M391 217H626" fill="none" stroke="#f87964" stroke-width="10" strok