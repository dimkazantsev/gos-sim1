<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>Два вопроса в одной клетке</title><desc>Жительница держит макет бюллетеня с одной крупной пустой клеткой.</desc><defs><linearGradient id="sky" x2=".6" y2="1"><stop stop-color="#172e56"/><stop offset=".68" stop-color="#638aa6"/><stop offset="1" stop-color="#f9ba88"/></linearGradient></defs><style>.water{animation:drift 5s ease-in-out infinite}.pulse{animation:breathe 3s ease-in-out infinite}.move{animation:nudge 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.snow{animation:fall 5s linear infinite}@keyframes drift{50%{transform:translate(7px,2px);opacity:.72}}@keyframes breathe{50%{opacity:.55}}@keyframes nudge{50%{transform:translate(4px,-3px)}}@keyframes fall{50%{transform:translate(-5px,11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="800" height="450" fill="url(#sky)"/><rect x="48" y="45" width="704" height="320" rx="8" fill="#667f97" stroke="#172e4e" stroke-width="4"/><path d="M0 333Q320 289 800 334V450H0Z" fill="#345574" stroke="#172e4e" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="235" y="103" width="314" height="239" rx="3" fill="#fffae9" stroke="#172e4e" stroke-width="4"/><path d="M250 123H534" fill="none" stroke="#6d8e9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M250 139H534" fill="none" stroke="#6d8e9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M250 155H534" fill="none" stroke="#6d8e9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><text x="247" y="334" font-size="15" font-weight="800" fill="#172e4e" font-family="sans-serif">Бюллетень</text><text x="269" y="135" font-size="24" font-weight="800" fill="#172e4e" font-family="sans-serif">Вопрос 1</text><text x="269" y="184" font-size="24" font-weight="800" fill="#172e4e" font-family="sans-seri