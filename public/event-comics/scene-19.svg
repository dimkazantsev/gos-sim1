<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>Антенна на последнем холме</title><desc>Монтажник с антенной смотрит на холм, закрывающий дальнюю деревню.</desc><defs><linearGradient id="sky" x2=".6" y2="1"><stop stop-color="#172e56"/><stop offset=".68" stop-color="#638aa6"/><stop offset="1" stop-color="#f9ba88"/></linearGradient></defs><style>.water{animation:drift 5s ease-in-out infinite}.pulse{animation:breathe 3s ease-in-out infinite}.move{animation:nudge 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.snow{animation:fall 5s linear infinite}@keyframes drift{50%{transform:translate(7px,2px);opacity:.72}}@keyframes breathe{50%{opacity:.55}}@keyframes nudge{50%{transform:translate(4px,-3px)}}@keyframes fall{50%{transform:translate(-5px,11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="800" height="450" fill="url(#sky)"/><path d="M0 208 130 142 244 217 374 159 570 205 702 154 800 198V355H0Z" fill="#526d87" opacity=".45"/><path d="M0 333Q320 289 800 334V450H0Z" fill="#345574" stroke="#172e4e" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M0 340 197 183 375 312 582 114 800 329V450H0Z" fill="#718f82" stroke="#172e4e" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M533 166V54M505 91H562M515 123H553" fill="none" stroke="#fff0d0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M475 73q-54 33-14 91M588 63q70 41 13 99" fill="none" stroke="#ffcf69" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><g transform="translate(429 214) scale(0.86)"><g class="move"><ellipse cx="0" cy="115" rx="40" ry="9" fill="#172e4e" opacity=".22"/><path d="M-13 63-19 104M13 63 23 104" fill="none" stroke="#172e4e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M-29 61V23Q-24-7 0-8Q26-6 29 22V61Z" fill="