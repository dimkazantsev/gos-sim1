<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>Тепло за историческим фасадом</title><desc>Житель показывает иней на внутренней стене старого дома.</desc><defs><linearGradient id="sky" x2=".6" y2="1"><stop stop-color="#172e56"/><stop offset=".68" stop-color="#638aa6"/><stop offset="1" stop-color="#f9ba88"/></linearGradient></defs><style>.water{animation:drift 5s ease-in-out infinite}.pulse{animation:breathe 3s ease-in-out infinite}.move{animation:nudge 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.snow{animation:fall 5s linear infinite}@keyframes drift{50%{transform:translate(7px,2px);opacity:.72}}@keyframes breathe{50%{opacity:.55}}@keyframes nudge{50%{transform:translate(4px,-3px)}}@keyframes fall{50%{transform:translate(-5px,11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="800" height="450" fill="url(#sky)"/><path d="M0 208 130 142 244 217 374 159 570 205 702 154 800 198V355H0Z" fill="#526d87" opacity=".45"/><path d="M0 333Q320 289 800 334V450H0Z" fill="#345574" stroke="#172e4e" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="110" y="84" width="354" height="259" rx="8" fill="#c6a899" stroke="#172e4e" stroke-width="4"/><path d="M89 84H485M119 134H454M119 241H454" fill="none" stroke="#e0d4bb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="170" y="157" width="118" height="75" rx="8" fill="#79bad6" stroke="#172e4e" stroke-width="4"/><path d="M229.0 157V232M170 194.5H288" fill="none" stroke="#e4f0ed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="317" y="157" width="100" height="75" rx="8" fill="#79bad6" stroke="#172e4e" stroke-width="4"/><path d="M367.0 157V232M317 194.5H417" fill="none" stroke="#e4f0ed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class=""/><g transform="translate(564 267) scale(0.9)"><g class="move