<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>Слушания за снежной стеной</title><desc>Снежный вал закрывает дорогу к освещённому дому культуры.</desc><defs><linearGradient id="sky" x2=".6" y2="1"><stop stop-color="#101e49"/><stop offset=".68" stop-color="#3b517d"/><stop offset="1" stop-color="#bf8092"/></linearGradient></defs><style>.water{animation:drift 5s ease-in-out infinite}.pulse{animation:breathe 3s ease-in-out infinite}.move{animation:nudge 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.snow{animation:fall 5s linear infinite}@keyframes drift{50%{transform:translate(7px,2px);opacity:.72}}@keyframes breathe{50%{opacity:.55}}@keyframes nudge{50%{transform:translate(4px,-3px)}}@keyframes fall{50%{transform:translate(-5px,11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="800" height="450" fill="url(#sky)"/><path d="M0 208 130 142 244 217 374 159 570 205 702 154 800 198V355H0Z" fill="#526d87" opacity=".45"/><path d="M0 333Q320 289 800 334V450H0Z" fill="#345574" stroke="#172e4e" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="309" y="88" width="330" height="236" rx="8" fill="#dbc9aa" stroke="#172e4e" stroke-width="4"/><rect x="429" y="119" width="77" height="70" rx="8" fill="#79bad6" stroke="#172e4e" stroke-width="4"/><path d="M467.5 119V189M429 154.0H506" fill="none" stroke="#e4f0ed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="439" y="217" width="63" height="108" rx="8" fill="#50718b" stroke="#172e4e" stroke-width="4"/><path d="M0 347Q91 257 233 304Q303 230 397 324L499 364V450H0Z" fill="#e5eff1" stroke="#172e4e" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" class=""/><g transform="translate(195 263) scale(0.74)"><g class="move"><ellipse cx="0" cy="115" rx="40" ry="9" fill="#172e4e" opacity=".22"/><path d="M-13 63-19 104M13 63 23 104" fill="none" stroke="#172e4e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M-29 61V23Q-24-7 0-8Q26-6 29 22V61Z" fill="#f87964" stroke="#172e4e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M-20 28-53 6M20 28 53-7" fill="none" stroke="#f87964" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" class=""/><circle cy="-44" r="23" fill="#edb68e" stroke="#172e4e" stroke-width="4"/><path d="M-23-48Q-27-69 0-67Q26-66 23-44L10-53-9-49Z" fill="#483849" stroke="#172e4e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><circle cx="-8" cy="-43" r="2.5" fill="#172e4e"/><circle cx="8" cy="-43" r="2.5" fill="#172e4e"/><path d="M-5-31Q0-28 5-31" fill="none" stroke="#172e4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><path d="M733 352V182Q733 155 768 162" fill="none" stroke="#172e4e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M747 168H797L786 195H757Z" fill="#ffcf69" stroke="#172e4e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M750 197 687 352H844L795 197Z" fill="#ffcf69" opacity=".13" class="pulse"/><text x="342" y="166" font-size="27" font-weight="800" fill="#172e4e" font-family="sans-serif">Слушания</text><circle cx="65" cy="91" r="4" fill="#fffae8" class="snow"/><circle cx="134" cy="139" r="4" fill="#fffae8" class="snow"/><circle cx="203" cy="187" r="4" fill="#fffae8" class="snow"/><circle cx="272" cy="91" r="4" fill="#fffae8" class="snow"/><circle cx="341" cy="139" r="4" fill="#fffae8" class="snow"/><circle cx="410" cy="187" r="4" fill="#fffae8" class="snow"/><circle cx="479" cy="91" r="4" fill="#fffae8" class="snow"/><circle cx="548" cy="139" r="4" fill="#fffae8" class="snow"/><circle cx="617" cy="187" r="4" fill="#fffae8" class="snow"/><circle cx="686" cy="91" r="4" fill="#fffae8" class="snow"/><path d="M4 4H796V446H4Z" fill="none" stroke="#fff5dc" stroke-width