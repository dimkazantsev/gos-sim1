<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOS//SIMS · Локальный Сеанс</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fc;color:#192e51;font:16px system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;padding:11px 15px;border:1px solid #ccdaef;border-radius:11px;background:white;color:#264b87}button:disabled{opacity:.55;cursor:default}input,select,textarea{width:100%;padding:11px;border:1px solid #ccdaef;border-radius:10px;min-width:0}label{display:grid;gap:7px}header{background:#173566;color:white;padding:22px max(20px,calc((100% - 1140px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:23px;margin:0}header small{display:block;margin-top:7px;color:#cddcf5}main{max-width:1180px;margin:auto;padding:24px;display:grid;gap:20px}nav{display:flex;gap:9px;overflow:auto;padding-bottom:4px}nav button{white-space:nowrap}.active,.primary{background:#295bba;color:white}.surface,article{background:white;border:1px solid #dce5f2;border-radius:17px;padding:20px;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.metrics strong{display:block;font-size:30px;margin:7px 0}.form{display:grid;gap:12px;max-width:700px}.cards{display:grid;gap:17px}.case{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:22px}.case img{width:100%;border-radius:12px}.case h3{font-size:22px;margin:9px 0}.case p,.post p{line-height:1.7;white-space:pre-wrap}.choices{display:grid;gap:8px}.choices button{text-align:left}.positive{border-color:#75b99c;background:#f2fbf6}.negative{opacity:.76;background:#f0f1f4;border-color:#b9bfca}.neutral{border-color:#c4cbd9}.tag{display:inline-block;border-radius:20px;padding:5px 10px;background:#eaf1fb;font-size:13px;margin:3px}.result{padding:13px;background:#eaf1fb;border-radius:10px;margin-top:12px;line-height:1.6}.notice{padding:13px;background:#fff1ce;border-radius:10px;line-height:1.5}.login{display:grid;gap:12px;max-width:580px;margin:30px auto}.sound{margin-top:9px}.split{display:flex;gap:12px;flex-wrap:wrap}a{color:#275aad}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{min-height:100px}#status:empty{display:none}#status{position:sticky;top:0;z-index:3}.roster article p{white-space:pre-wrap;line-height:1.6}@media(max-width:680px){main{padding:15px}.case{grid-template-columns:1fr}.case img{max-height:260px;object-fit:cover}header{padding:18px}header h1{font-size:19px}.surface,article{padding:16px}}
</style></head><body><header><div><h1>GOS//SIMS</h1><small id="heading">Локальная Копия Сеанса</small></div><button id="logout" hidden>Выйти</button></header><main><div id="status" class="notice" role="status"></div><div id="app"></div></main><script id="session-data" type="application/json">__GOS_SESSION_DATA__</script><script>
'use strict';
const embed=JSON.parse(document.getElementById('session-data').textContent),network=location.protocol==='http:'||location.protocol==='https:',app=document.getElementById('app'),status=document.getElementById('status');
let state=embed,user=null,view='overview',sound=null,poll=null;
const key='gos-portable-'+(embed?.game?.id||location.pathname),html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!network){try{state=JSON.parse(localStorage.getItem(key))||embed}catch{state=embed}}
const table=n=>state?.tables?.[n]||[],teacher=()=>user?.kind==='teacher',now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID();
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка запроса');return data}
function message(s){status.textContent=s}
function persist(){localStorage.setItem(key,JSON.stringify(state))}
function login(){app.innerHTML='<section class="surface login"><h2>Вход В Локальный Сеанс</h2><p>Исходные пароли не входят в архив. При запуске сервера новые коды преподавателя и участников показаны в терминале.</p><form id="login-form" class="form"><label>Роль<select name="kind"><option value="observer">Гость</option><option value="student">Участник</option><option value="teacher">Преподаватель</option></select></label><label>ФИО<input name="name" placeholder="Фамилия Имя Отчество"></label><label>Код Локального Сеанса<input name="password" type="password" autocomplete="current-password"></label><button class="primary">Войти</button></form><small>'+(network?'Сервер хранит общий прогресс.':'Файловый режим хранит прогресс в этом браузере. Для общей игры запустите Server.mjs.')+'</small></section>';document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),body=Object.fromEntries(f);try{if(network){const r=await api('login',body);user=r.user;state=r.state}else{user={id:table('game_members').find(m=>m.full_name===body.name&&m.kind===body.kind)?.user_id||state.game.owner_id,kind:body.kind,name:body.name||'Гость'};if(body.kind==='student'&&!table('game_members').some(m=>m.user_id===user.id&&m.kind==='student'))throw Error('Укажите ФИО участника из исходного сеанса.')};message('');render();if(network&&!poll)poll=setInterval(refresh,3500)}catch(e){message(e.message)}}}
async function refresh(){if(!network||!user||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;try{const r=await api('state');state=r.state;user=r.user;render()}catch(e){message(e.message)}}
async function mutate(action,data){try{if(network){const r=await api('action',{action,...data});state=r.state}else{localAction(action,data);persist()};message('Сохранено.');render()}catch(e){message(e.message)}}
__GOS_SESSION_ENGINE__
function localAction(action,d){applyPortableAction(state,user,action,d)}
function tabs(){return [['overview','Обзор'],['events','События'],['process','Политические Процессы'],['profiles','Профили'],['documents','Документы'],['stages','Этапы'],...(teacher()?[['manage','Управление']]:[])]}
function art(c){return c?.comic_scene?.portable_image?'<img src="'+html(c.comic_scene.portable_image)+'" alt="'+html(c.title)+'">':''}
function events(){const assigned=table('event_assignments');return '<div class="cards">'+table('event_cases').filter(c=>assigned.some(a=>a.case_id===c.id)&&(user.kind!=='student'||assigned.some(a=>a.case_id===c.id&&a.recipient_id===user.id))).map(c=>{const a=assigned.find(x=>x.case_id===c.id&&x.recipient_id===user.id),o=table('event_case_outcomes').find(x=>x.case_id===c.id),votes=table('event_decisions').filter(x=>x.case_id===c.id),index=o?Number(o.winner.replace('option_',''))-1:-1;return '<article class="case '+(o?((o.resolution_kind||'')==='beneficial'?'positive':(o.resolution_kind||'')==='harmful'?'negative':'neutral'):'')+'"><div>'+art(c)+'<button class="sound">Включить Звук</button></div><div><span class="tag">'+html(c.category)+'</span><h3>'+html(c.title)+'</h3><p>'+html(c.situation)+'</p><div class="choices">'+(c.decision_options||['Принять','Отклонить']).map((l,i)=>'<button data-vote="'+html(a?.id||'')+'" data-index="'+i+'" '+(!a||a.status!=='pending'||user.kind!=='student'||o?'disabled':'')+'>'+html(l)+' · Голосов: '+votes.filter(v=>v.choice==='option_'+(i+1)||(i===0&&v.choice==='accept')||(i===1&&v.choice==='reject')).length+'</button>').join('')+'</div>'+(o?'<div class="result">Итог: '+html(index<0?'Равное Число Голосов':c.decision_options[index])+'<br>Изменение Доверия: '+o.trust_delta+' П.п.</div>':'')+'</div></article>'}).join('')+'</div>'}
function render(){if(!user){login();return}document.getElementById('logout').hidden=false;document.getElementById('heading').textContent=state.game.title+' · '+state.game.game_code+' · '+(teacher()?'Преподаватель':user.kind==='student'?'Участник':'Гость');let body='';
 if(view==='overview')body='<div class="grid metrics">'+table('state_metrics').map(m=>'<article><span>'+html(m.label)+'</span><strong>'+html(m.value)+' '+html(m.unit)+'</strong>'+(teacher()?'<button data-metric="'+html(m.id)+'">Изменить Показатель</button>':'')+'</article>').join('')+'</div><section class="surface"><h2>Сеанс Сохранён</h2><p>События, решения, голосования, показатели и документы восстановлены из архива. Для полной версии всех формальных институтов используйте исходный Next.js-проект с локальным Supabase.</p></section>';
 if(view==='events')body=events();
 if(view==='process')body='<div class="cards">'+table('political_posts').map(p=>'<article class="post"><span class="tag">'+html(p.actor_label||'Участник')+'</span><h3>'+html(p.title)+'</h3><p>'+html(p.body)+'</p>'+art({title:p.title,comic_scene:p.comic_scene})+'</article>').join('')+'</div>';
 if(view==='profiles')body='<div class="grid roster">'+table('game_members').map(m=>{const p=table('game_profiles').find(x=>x.user_id===m.user_id);return '<article><h3>'+html(m.full_name)+'</h3><span class="tag">'+html(m.role_title||m.kind)+'</span><p>'+html(p?.bio||'Описание Не Добавлено')+'</p></article>'}).join('')+'</div>';
 if(view==='documents')body='<div class="cards">'+[...table('formal_documents'),...table('game_documents')].map(d=>'<article><span class="tag">'+html(d.status||d.doc_type||'Документ')+'</span><h3>'+html(d.title)+'</h3><p>'+html(d.body||d.content||'')+'</p></article>').join('')+'</div>';
 if(view==='stages')body='<div class="grid">'+table('game_stages').map(s=>'<article><span class="tag">Этап '+s.stage_no+' · '+html(s.status)+'</span><h3>'+html(s.title)+'</h3><p>'+html(s.summary||'')+'</p>'+(teacher()?'<button data-stage="'+html(s.id)+'">Открыть Этап</button>':'')+'</article>').join('')+'</div>';
 if(view==='manage'&&teacher())body='<section class="surface"><h2>Назначить Событие</h2><form id="assign" class="form"><label>Событие<select name="case_id">'+table('event_cases').filter(c=>c.status==='ready'&&!table('event_case_outcomes').some(o=>o.case_id===c.id)).map(c=>'<option value="'+html(c.id)+'">'+html(c.title)+'</option>').join('')+'</select></label><label>Участники<select name="recipient_ids" multiple size="4">'+table('game_members').filter(m=>m.kind==='student').map(m=>'<option value="'+html(m.user_id)+'">'+html(m.full_name)+'</option>').join('')+'</select></label><p>Для Общего События Будут Выбраны Все Участники. Для Группового Выберите Двух Или Трёх; Для Индивидуального — Одного.</p><button class="primary">Назначить</button></form></section><section class="surface split"><button id="export">Скачать JSON Прогресса</button><button id="reset">Вернуть Исходный Сеанс</button></section>';
 app.innerHTML='<nav>'+tabs().map(([v,l])=>'<button data-view="'+v+'" class="'+(view===v?'active':'')+'">'+l+'</button>').join('')+'</nav>'+body;
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;message('');render()});document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>mutate('vote',{assignment_id:b.dataset.vote,index:Number(b.dataset.index)}));document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{const m=table('state_metrics').find(x=>x.id===b.dataset.metric),v=prompt('Новое Значение: '+m.label,m.value);if(v===null)return;const note=prompt('Обоснование Изменения','Корректировка Преподавателя');if(note===null)return;mutate('metric',{id:m.id,value:Number(v),note,publish:confirm('Опубликовать Изменение В Политическом Процессе?')})});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>mutate('stage',{id:b.dataset.stage,status:'open'}));document.querySelectorAll('.sound').forEach(b=>b.onclick=()=>toggleSound(b));const f=document.getElementById('assign');if(f)f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),case_id=fd.get('case_id'),c=table('event_cases').find(x=>x.id===case_id);mutate('assign',{case_id,recipient_ids:c?.audience==='all'?table('game_members').filter(m=>m.kind==='student').map(m=>m.user_id):fd.getAll('recipient_ids')})};const exp=document.getElementById('export');if(exp)exp.onclick=async()=>{try{const data=network?await api('export'):state;const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='GOS-SIMS-'+state.game.game_code+'-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){message(e.message)}};const reset=document.getElementById('reset');if(reset)reset.onclick=async()=>{if(!confirm('Отменить Изменения Локальной Копии И Вернуть Исходный Сеанс?'))return;try{if(network){const r=await api('reset',{});state=r.state}else{state=structuredClone(embed);persist()};render()}catch(e){message(e.message)}};
}
function toggleSound(button){if(sound){sound.stop();sound=null;button.textContent='Включить Звук';return}const ctx=new AudioContext(),buffer=ctx.createBuffer(1,ctx.sampleRate*36,ctx.sampleRate),s=buffer.getChannelData(0);for(let i=0;i<s.length;i++){const t=i/ctx.sampleRate,fade=Math.max(0,Math.min(1,t/1.5,(36-t)/1.5));s[i]=fade*(Math.sin(t*2*Math.PI*130.8333)*.06+Math.sin(t*2*Math.PI*196)*.035)}sound=ctx.createBufferSource();sound.buffer=buffer;sound.loop=true;sound.connect(ctx.destination);sound.start();button.textContent='Выключить Звук';sound.onended=()=>ctx.close()}
document.getElementById('logout').onclick=async()=>{if(network)await api('logout',{});user=null;if(poll)clearInterval(poll);poll=null;view='overview';document.getElementById('logout').hidden=true;login()};login();
</script></body></html>
