name: Public game on GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/prepare-github-pages.mjs'
      - 'scripts/github-pages-check.mjs'
      - 'scripts/finalize-github-pages-social.mjs'
      - 'scripts/verify-github-pages-live.mjs'
      - 'public/share/gos-id-preview.jpg'
      - 'public/visit/index.html'
      - 'app/layout.tsx'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/prepare-github-pages.mjs
      - run: npm ci && npm run build
        working-directory: .pages-build
        env:
          NEXT_PUBLIC_ASSET_BASE_PATH: /gos-sim1
          NEXT_PUBLIC_GAME_API_ORIGIN: https://gos-sim1.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://bderfrcfuhnutuoyudje.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLIC_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - run: node scripts/install-github-pages-fallback.mjs
      - run: node scripts/finalize-github-pages-social.mjs
      - run: node scripts/github-pages-check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-build/out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live link previews and JPEG
        run: node scripts/verify-github-pages-live.mjs
