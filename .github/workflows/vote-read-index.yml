name: Voting read-index regression
on:
  pull_request:
    paths:
      - 'components/game/voteReadIndex.ts'
      - 'components/game/useRepublicGame.ts'
      - 'scripts/vote-read-index-check.cjs'
      - '.github/workflows/vote-read-index.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/vote-read-index-check.cjs
