name: Authored legal cases and individual artwork
on:
  push:
    branches: ['codex/civic-*']
    paths: ['scripts/build-legal-cases.py','content/legal-cases-*.tsv','content/legal-case-alternatives.txt']
permissions:
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/build-legal-cases.py
      - name: Preserve independently authored content
        run: |
          git config user.name "Codex legal case content"
          git config user.email "codex-legal-cases@users.noreply.github.com"
          git add content/events-legal-2026.json public/event-comics/scene-*.svg supabase/changes/20261002_150_legal_cases.sql docs/CASE_CONTENT_AUDIT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: 150 individual legal cases and 1920×1080 scenes"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
