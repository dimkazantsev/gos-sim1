name: 'ГОС.ID · 100 JWT: Последствия 16 этапов и восстановление'
on:
  pull_request:
    paths:
      - '.github/workflows/impact-projection-auth-100.yml'
      - 'supabase/tests/impact_projection_100_local.cjs'
      - 'supabase/tests/impact_projection_100_local_setup.sql'
      - 'supabase/migrations/20261029144000_impact_engine_projection_invoker.sql'
      - 'supabase/migrations/20261031165000_impact_ledger_ten_projection.sql'
      - 'scripts/impact-engine-projection-rls-check.cjs'
      - 'components/game/ImpactRulesPanel.tsx'
      - 'components/game/useRepublicGame.ts'
permissions:
  contents: read
concurrency:
  group: gos-impact-projection-auth-100-qa
  cancel-in-progress: true
jobs:
  impact-projection-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOS_IMPACT_PROJECTION_QA: LOCAL-100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check supabase/tests/impact_projection_100_local.cjs
      - run: node scripts/impact-engine-projection-rls-check.cjs
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start disposable local Supabase
        run: |
          set -euo pipefail
          mkdir -p /tmp/gos-impact-projection-100
          cd /tmp/gos-impact-projection-100
          supabase init
          supabase start -x storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Export local loopback credentials only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gos-impact-projection-100
          while IFS='=' read -r key value; do
            value="$(printf '%s' "$value" | sed 's/^"//;s/"$//')"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done < <(
            supabase status -o env \
              --override-name api.url=SUPABASE_URL \
              --override-name auth.anon_key=SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - name: Load local RLS fixture and ten-entry server projection
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gos-impact-projection-100
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\([^"]*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/blitz_supabase_setup.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/impact_projection_100_local_setup.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261029144000_impact_engine_projection_invoker.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261031165000_impact_ledger_ten_projection.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          sleep 2
      - name: Verify 100 JWT readers, role isolation and reconnection
        run: node supabase/tests/impact_projection_100_local.cjs
      - name: Destroy disposable environment without backup
        if: always()
        run: |
          cd /tmp/gos-impact-projection-100 || exit 0
          supabase stop --no-backup
