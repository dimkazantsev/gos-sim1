name: Participant access security checks
on:
  pull_request:
    paths:
      - 'components/game/TeacherParticipantRoster.tsx'
      - 'supabase/migrations/20261013191740_teacher_participant_access_20261014.sql'
      - 'scripts/participant-access-security-check.cjs'
      - '.github/workflows/participant-access.yml'
  push:
    branches: [main]
    paths:
      - 'components/game/TeacherParticipantRoster.tsx'
      - 'supabase/migrations/20261013191740_teacher_participant_access_20261014.sql'
      - 'scripts/participant-access-security-check.cjs'
jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check participant access and deletion guards
        run: node scripts/participant-access-security-check.cjs
