name: Acquire verified regional reference data
on:
  push:
    branches: ['codex/civic-*']
    paths: ['scripts/acquire-regions.py']
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pymupdf shapely cryptography
      - run: python scripts/acquire-regions.py
      - name: Preserve verified source data
        run: |
          git config user.name "Codex regional data"
          git config user.email "codex-regional-data@users.noreply.github.com"
          git add data/region-map.json data/regional-source-extract.json docs/REGIONAL_DATA_SOURCES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: acquire attributed regional boundaries and Rosstat source extract"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
