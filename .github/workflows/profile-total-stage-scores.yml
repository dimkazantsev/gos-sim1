name: ГОС.ID · Сумма оценок в личном кабинете
on:
  pull_request:
    paths:
      - 'components/game/ProfileView.tsx'
      - 'scripts/profile-total-stage-scores-check.cjs'
      - '.github/workflows/profile-total-stage-scores.yml'
  push:
    branches: [main]
    paths:
      - 'components/game/ProfileView.tsx'
      - 'scripts/profile-total-stage-scores-check.cjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bderfrcfuhnutuoyudje.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/profile-total-stage-scores-check.cjs
      - run: node scripts/profile-grades-layout-check.cjs
      - run: node scripts/party-grades-stage-consistency-check.cjs
      - run: npm run typecheck
