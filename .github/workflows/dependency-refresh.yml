name: Dependency security refresh
on:
  push:
    paths:
      - '.github/workflows/dependency-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate patched dependency lock
        run: npm install --save-exact next@16.3.8 react@19.2.8 react-dom@19.2.8
      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only || true
      - name: Report remaining audit findings
        run: npm audit --audit-level=moderate || true
      - name: Commit resolved dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/dependency-refresh.yml
          git add package.json package-lock.json .github/workflows/dependency-refresh.yml
          git commit -m "Patch framework dependencies after security audit"
          git push origin HEAD:main
