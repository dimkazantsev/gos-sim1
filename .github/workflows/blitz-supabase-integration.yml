name: Blitz local Supabase integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/*blitz*'
      - 'supabase/tests/blitz_supabase_*'
      - '.github/workflows/blitz-supabase-integration.yml'
  push:
    branches: ["feature/blitz-questions-*"]
  workflow_dispatch:
jobs:
  local-supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Initialize local Supabase project
        run: test -f supabase/config.toml || supabase init
      - name: Start local Supabase stack
        run: supabase start
      - name: Export local credentials
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env             --override-name api.url=SUPABASE_URL             --override-name auth.anon_key=SUPABASE_ANON_KEY             --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY >> "$GITHUB_ENV"
      - name: Create disposable Blitz integration schema
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/blitz_supabase_setup.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261012100100_blitz_attempt_lock_hardening.sql
      - name: Run 30 real local Supabase sessions
        run: node supabase/tests/blitz_supabase_30_sessions.cjs
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
