name: Primary regional statistics
on:
  push:
    branches: ['codex/civic-*']
    paths: ['scripts/acquire-statistics.py']
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography openpyxl xlrd pymupdf
      - run: python scripts/acquire-statistics.py
      - name: Preserve primary data
        run: |
          git config user.name "Codex statistics"
          git config user.email "codex-statistics@users.noreply.github.com"
          git add data/statistics-source-extract.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: primary-source regional observations"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-statistics-source
          path: data/statistics-source-extract.json
