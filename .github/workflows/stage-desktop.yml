name: Teacher UI and stage regression

on:
  push:
    branches: [main]
    paths:
      - 'components/game/StagesView.tsx'
      - 'components/game/TeacherView.tsx'
      - 'components/game/TeacherStageManager.tsx'
      - 'components/game/StagePolicyEditor.tsx'
      - 'components/game/TeacherPartyDossiers.tsx'
      - 'components/game/TeacherGhostVotingPanel.tsx'
      - 'components/game/EventWorkspace.tsx'
      - 'components/game/ClassroomJournal.tsx'
      - 'components/game/ParticipantsAnalytics.tsx'
      - 'components/game/GradesView.tsx'
      - 'components/game/ProfileView.tsx'
      - 'components/GameClient.tsx'
      - 'app/stage-map.css'
      - 'app/teacher-command.css'
      - 'app/teacher-operations.css'
      - 'app/teacher-ui-polish.css'
      - 'app/teacher-extended.css'
      - 'app/layout.tsx'
      - 'app/globals.css'
      - 'app/design-*.css'
      - 'scripts/design-preview.cjs'
      - 'scripts/design-audit.mjs'
      - 'scripts/stage-desktop-browser-check.cjs'
      - 'scripts/teacher-command-browser-check.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/stage-desktop.yml'
  pull_request:
    paths:
      - 'components/game/**'
      - 'components/GameClient.tsx'
      - 'app/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Design audit
        run: npm run design:check
      - name: Build real component preview
        run: npm run design:preview
      - name: Stage cards visual regression
        run: npm run design:stages
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Teacher command centre, journal, analytics and grades regression
        run: npm run design:teacher
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Upload visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-ui-screenshots
          path: |
            .design-review/screenshots/stages-*.png
            .design-review/screenshots/teacher-stages-*.png
            .design-review/screenshots/teacher-*.png
          if-no-files-found: ignore
