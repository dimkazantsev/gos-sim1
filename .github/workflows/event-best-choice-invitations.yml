name: ГОС.ID · События — правильный ответ и приглашения
on:
  pull_request:
    paths:
      - 'components/game/EventChoicePanel.tsx'
      - 'components/game/EventCollaboration.tsx'
      - 'app/2026-collaboration.css'
      - 'scripts/event-invite-best-choice-check.cjs'
      - 'supabase/migrations/20261020093000_event_invitations_active_students.sql'
      - '.github/workflows/event-best-choice-invitations.yml'
  push:
    branches: [main]
    paths:
      - 'components/game/EventChoicePanel.tsx'
      - 'components/game/EventCollaboration.tsx'
      - 'app/2026-collaboration.css'
      - 'scripts/event-invite-best-choice-check.cjs'
      - 'supabase/migrations/20261020093000_event_invitations_active_students.sql'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bderfrcfuhnutuoyudje.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/event-invite-best-choice-check.cjs
      - run: node scripts/event-delegation-scoring-check.cjs
      - run: node scripts/event-option-legality-check.cjs
      - run: npm run typecheck
