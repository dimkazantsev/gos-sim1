name: Build Check

on:
  pull_request:
    paths:
      - 'components/game/Blitz*.tsx'
      - 'components/game/TeacherBlitz.tsx'
      - 'components/game/PoliticalWallView.tsx'
      - 'components/ui/BrandIdentity.tsx'
      - 'components/game/DashboardView.tsx'
      - 'components/game/StageReadinessPanel.tsx'
      - 'components/game/TeacherView.tsx'
      - 'app/stage-map.css'
      - 'scripts/stage-readiness-manual-check.cjs'
      - 'app/2026-document-workflow-v2.css'
      - 'app/2026-npa-workspace-canonical.css'
      - 'scripts/overview-live-posts-check.cjs'
      - 'scripts/npa-toolbar-alignment-browser-check.cjs'
      - 'components/GameClient.tsx'
      - 'app/brand-identity.css'
      - 'app/icon.svg'
      - 'app/page.tsx'
      - 'app/layout.tsx'
      - 'scripts/brand-overview-check.cjs'
      - 'app/2026-political-process.css'
      - 'components/game/politicalWallPaging.ts'
      - 'scripts/political-wall-feed-check.cjs'
      - 'scripts/political-wall-status-browser-check.cjs'
      - 'components/game/GradesView.tsx'
      - 'supabase/migrations/*blitz*'
      - 'supabase/migrations/*crisis_baseline*'
      - 'components/game/CivicDiscussion.tsx'
      - 'components/game/useRepublicGame.ts'
      - 'scripts/crisis-baseline-check.cjs'
      - '.github/workflows/build-check.yml'
  push:
    branches: [main, "feature/blitz-questions-*", "codex/civic-*", "codex/budget-amendments-*", "codex/project-audit-*", "fix/fast-login-*", "fix/stabilize-runtime-*", "fix/realtime-capacity-*", "fix/situation-icons-only-*", "fix/realtime-capacity-sync-indicator-*", "fix/bootstrap-no-realtime-*", "fix/password-login-bypass-refresh-*", "fix/profile-refresh-navigation-*", "fix/restore-current-screen-on-refresh-*", "fix/events-targeted-stability-*", "fix/event-header-button-style-*", "fix/event-refresh-next-to-status-*", "fix/lazy-event-bank-bulk-manage-*", "fix/lazy-event-bank-bulk-manage-reorder-*", "feat/pau-regional-event-routing-*"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bderfrcfuhnutuoyudje.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit — high and critical
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: node scripts/game-roster-check.cjs
      - run: node scripts/user-error-check.cjs
      - run: node scripts/intro-refresh-check.cjs
      - run: node scripts/brand-overview-check.cjs
      - run: node scripts/overview-live-posts-check.cjs
      - run: node scripts/republic-game-resilience-check.cjs
      - run: node scripts/editor-async-resilience-check.cjs
      - run: node scripts/readiness-matrix-check.cjs
      - run: node scripts/stage-readiness-manual-check.cjs
      - run: node scripts/document-input-check.cjs
      - run: node scripts/electoral-math-check.cjs
      - run: node scripts/grade-fractional-check.cjs
      - run: node scripts/chat-media-transport-check.cjs
      - run: node scripts/event-option-legality-check.cjs
      - run: npm run design:check
      - run: node scripts/interface-contract-check.cjs
      - run: node scripts/political-wall-feed-check.cjs
      - run: node scripts/crisis-baseline-check.cjs

      - run: node scripts/fiscal-model-check.cjs
      - run: node scripts/event-card-browser-check.cjs
      - run: npm run design:preview
      - run: node scripts/overview-budget-browser-check.cjs
      - run: node scripts/political-wall-status-browser-check.cjs
      - run: node scripts/npa-toolbar-alignment-browser-check.cjs
      - run: node scripts/registry-browser-check.cjs
      - run: node scripts/october-flow-browser-check.cjs
      - run: node scripts/october-budget-awards-browser-check.cjs
      - run: npm run design:interactive
      - run: npm run design:browser
      - run: npm run design:dock
      - run: npm run design:mobile
      - run: npm run design:teacher
      - run: npm run design:impact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metric-modal-responsive-screenshots
          path: .design-review/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
