name: Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bderfrcfuhnutuoyudje.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run typecheck
      - run: node scripts/intro-refresh-check.cjs
      - run: npm run design:check
      - run: node scripts/interface-contract-check.cjs
      - run: node scripts/event-card-browser-check.cjs
      - run: npm run design:preview
      - run: node scripts/registry-browser-check.cjs
      - run: npm run design:interactive
      - run: npm run design:browser
      - run: npm run design:dock
      - run: npm run design:mobile
      - run: npm run design:teacher
      - run: npm run design:impact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metric-modal-responsive-screenshots
          path: .design-review/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
