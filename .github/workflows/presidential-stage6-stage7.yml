      - 'components/game/stageOperations.ts'
      - 'components/game/stageDetails.ts'
      - '.github/workflows/presidential-stage6-stage7.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/presidential-stage6-stage7-migration-check.cjs
      - run: node scripts/stage6-cec-restoration-check.cjs
      - run: node scripts/presidential-party-photo-upload-check.cjs
      - run: node scripts/cec-document-review-actions-check.cjs
      - run: node scripts/cec-targeted-document-revision-check.cjs
      - run: node scripts/cec-registration-and-complaints-check.cjs
      - run: node scripts/cec-official-forms-signature-check.cjs
      - run: node scripts/cec-chair-signature-inflection-check.cjs
      - run: node scripts/stage6-responsive-browser-check.cjs
      - run: node scripts/stage6-cec-visual-browser-check.cjs
      - run: npm run typecheck
