name: Permanent Teacher and Meeting Flow
on:
  pull_request:
    paths:
      - 'app/teacher/**'
      - 'app/page.tsx'
      - 'components/GameClient.tsx'
      - 'components/game/ElectoralArchitectureLab.tsx'
      - 'components/game/GovernanceStageWorkspace.tsx'
      - 'components/game/StageMeetingProcedureFlow*'
      - 'supabase/migrations/20261024160000_permanent_teacher_profile.sql'
      - 'supabase/migrations/20261024161000_regional_agreement_from_published.sql'
      - 'supabase/migrations/20261024234000_teacher_account_signature_onboarding.sql'
      - 'scripts/teacher-signature-onboarding-check.cjs'
      - 'scripts/permanent-teacher-flow-check.cjs'
      - 'components/game/TeacherGameSessions.tsx'
      - 'components/game/TeacherAccessCodes.tsx'
      - 'components/game/teacher-game-sessions.css'
      - 'supabase/migrations/20261025113000_strict_roles_and_owner_codes.sql'
      - 'supabase/migrations/20261025114000_owner_only_code_management.sql'
      - 'supabase/migrations/20261025115000_protect_owner_name_and_teacher_profiles.sql'
      - 'scripts/strict-role-and-owner-codes-check.cjs'
      - 'scripts/participant-test-login-check.cjs'
      - 'scripts/participant-mobile-signature-check.cjs'
      - 'components/game/GuidedTour.tsx'
      - 'components/game/GuidedTour.module.css'
      - 'app/mobile-nav-polish.css'
      - 'app/entry-qr.css'
      - 'supabase/migrations/20261025002500_prevent_cross_role_rejoin.sql'
      - 'scripts/teacher-entry-navigation-check.cjs'
      - '.github/workflows/permanent-teacher-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/permanent-teacher-flow-check.cjs
      - run: node scripts/participant-test-login-check.cjs
      - run: node scripts/strict-role-and-owner-codes-check.cjs
      - run: node scripts/password-login-resilience-check.cjs
      - run: node scripts/participant-mobile-signature-check.cjs
      - run: node scripts/teacher-entry-navigation-check.cjs
      - run: node scripts/teacher-signature-onboarding-check.cjs
      - run: node scripts/ksrf-proposal-queue-check.cjs
