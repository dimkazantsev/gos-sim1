name: ГОС.ID · Президентские цели и документы Этапа 10
on:
  pull_request:
    paths:
      - 'components/game/StateProgramLab.tsx'
      - 'components/game/StateProgramEditor.tsx'
      - 'components/game/StageForms.module.css'
      - 'supabase/migrations/*stage10_president_approved_goals_and_registry_sync.sql'
      - 'supabase/migrations/*stage10_president_authored_goals_and_office_rights.sql'
      - 'supabase/migrations/*stage10_presidential_rls_function_execute_grant.sql'
      - 'scripts/stage10-president-goals-document-sync-check.cjs'
      - 'scripts/stage10-single-program-work-links-check.cjs'
      - 'components/game/StageArtifacts.tsx'
      - 'components/game/GovernanceStageWorkspace.tsx'
      - 'supabase/migrations/*stage10_one_state_program_no_separate_feo.sql'
      - 'supabase/migrations/*stage10_accept_synchronized_ministry_programme.sql'
      - 'supabase/migrations/*government_program_vote_then_pm_signature.sql'
      - 'components/game/GovernmentProgramSessionLab.tsx'
      - 'components/game/stateProgramModel.ts'
      - 'scripts/government-program-vote-before-sign-check.cjs'
      - 'supabase/migrations/*government_ministry_appointment_electorate.sql'
      - 'scripts/government-ministry-electorate-check.cjs'
      - 'scripts/stage10-rejected-program-debt-check.cjs'
      - 'supabase/migrations/*government_auto_agenda_chair_questions_vote.sql'
      - 'components/game/stageDetails.ts'
      - 'components/game/stageOperations.ts'
      - 'components/game/stageSystem.ts'
      - 'app/2026-october-refinement.css'
      - 'scripts/government-stage11-agenda-procedure-check.cjs'
      - 'components/ui/StageModuleHeader.module.css'
      - 'scripts/government-stage11-responsive-browser-check.cjs'
      - '.github/workflows/stage10-president-goals-documents.yml'
  push:
    branches: [main]
    paths:
      - 'components/game/StateProgramLab.tsx'
      - 'components/game/StateProgramEditor.tsx'
      - 'components/game/StageForms.module.css'
      - 'supabase/migrations/*stage10_president_approved_goals_and_registry_sync.sql'
      - 'supabase/migrations/*stage10_president_authored_goals_and_office_rights.sql'
      - 'supabase/migrations/*stage10_presidential_rls_function_execute_grant.sql'
      - 'scripts/stage10-president-goals-document-sync-check.cjs'
      - 'scripts/stage10-single-program-work-links-check.cjs'
      - 'components/game/StageArtifacts.tsx'
      - 'components/game/GovernanceStageWorkspace.tsx'
      - 'supabase/migrations/*stage10_one_state_program_no_separate_feo.sql'
      - 'supabase/migrations/*stage10_accept_synchronized_ministry_programme.sql'
      - 'supabase/migrations/*government_program_vote_then_pm_signature.sql'
      - 'components/game/GovernmentProgramSessionLab.tsx'
      - 'components/game/stateProgramModel.ts'
      - 'scripts/government-program-vote-before-sign-check.cjs'
      - 'supabase/migrations/*government_ministry_appointment_electorate.sql'
      - 'scripts/government-ministry-electorate-check.cjs'
      - 'scripts/stage10-rejected-program-debt-check.cjs'
      - 'supabase/migrations/*government_auto_agenda_chair_questions_vote.sql'
      - 'components/game/stageDetails.ts'
      - 'components/game/stageOperations.ts'
      - 'components/game/stageSystem.ts'
      - 'app/2026-october-refinement.css'
      - 'scripts/government-stage11-agenda-procedure-check.cjs'
      - 'components/ui/StageModuleHeader.module.css'
      - 'scripts/government-stage11-responsive-browser-check.cjs'
      - '.github/workflows/stage10-president-goals-documents.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/stage10-president-goals-document-sync-check.cjs
      - run: node scripts/stage10-single-program-work-links-check.cjs
      - run: node scripts/government-program-vote-before-sign-check.cjs
      - run: node scripts/government-ministry-electorate-check.cjs
      - run: node scripts/stage10-rejected-program-debt-check.cjs
      - run: node scripts/government-stage11-agenda-procedure-check.cjs
      - name: Find Chrome for Stage 11 responsive check
        run: |
          for binary in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium; do
            if test -x "$binary"; then echo "CHROME_BIN=$binary" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - run: node scripts/government-stage11-responsive-browser-check.cjs
      - run: node scripts/stage10-ministry-team-rights-check.cjs
      - run: node scripts/stage-final-documents-gate-check.cjs
      - run: npm run typecheck
