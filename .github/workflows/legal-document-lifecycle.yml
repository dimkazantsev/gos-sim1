name: Legal Document Lifecycle
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261019011000_formal_legal_routes_and_presidential_amendment.sql'
      - 'components/game/DocumentsView.tsx'
      - 'components/game/DocumentPaper.tsx'
      - 'components/game/PresidentialSystemDecisionPanel.tsx'
      - 'scripts/formal-document-legal-lifecycle-regression.cjs'
      - 'docs/FORMAL_DOCUMENT_LIFECYCLE_AUDIT_2026-10-19.md'
      - '.github/workflows/legal-document-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261019011000_formal_legal_routes_and_presidential_amendment.sql'
      - 'components/game/DocumentsView.tsx'
      - 'components/game/DocumentPaper.tsx'
      - 'components/game/PresidentialSystemDecisionPanel.tsx'
      - 'scripts/formal-document-legal-lifecycle-regression.cjs'
      - '.github/workflows/legal-document-lifecycle.yml'
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/formal-document-legal-lifecycle-regression.cjs
      - run: npm run typecheck
