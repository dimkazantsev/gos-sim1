name: 'ГОС.ID · 100 JWT: Документы 16 этапов и RLS'
on:
  pull_request:
    paths:
      - '.github/workflows/formal-registry-auth-100.yml'
      - 'supabase/tests/formal_registry_100_local_setup.sql'
      - 'supabase/tests/formal_registry_100_local.cjs'
      - 'supabase/migrations/20261029171500_formal_registry_projection_invoker.sql'
permissions:
  contents: read
concurrency:
  group: gos-formal-registry-auth-100-qa
  cancel-in-progress: true
jobs:
  formal-registry-auth-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOS_FORMAL_REGISTRY_QA: LOCAL-100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate local-only 100-JWT test syntax
        run: node --check supabase/tests/formal_registry_100_local.cjs
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start clean temporary Supabase on loopback
        run: |
          set -euo pipefail
          mkdir -p /tmp/gos-formal-registry-100
          cd /tmp/gos-formal-registry-100
          supabase init
          supabase start -x storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Read only local temporary credentials
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gos-formal-registry-100
          while IFS='=' read -r key value; do
            value="$(printf '%s' "$value" | sed 's/^"//;s/"$//')"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done < <(
            supabase status -o env \
              --override-name api.url=SUPABASE_URL \
              --override-name auth.anon_key=SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - name: Install disposable tables and unchanged production invoker function
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gos-formal-registry-100
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\([^"]*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/blitz_supabase_setup.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/formal_registry_100_local_setup.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261029171500_formal_registry_projection_invoker.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          sleep 2
      - name: Verify 100 separate JWT reads, 16 stages, RLS and reauthentication
        run: node supabase/tests/formal_registry_100_local.cjs
      - name: Erase disposable local database without backup
        if: always()
        run: |
          cd /tmp/gos-formal-registry-100 || exit 0
          supabase stop --no-backup
