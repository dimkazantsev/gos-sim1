name: Document Emblems
on:
  push:
    paths:
      - 'scripts/download-institution-emblems.py'
      - '.github/workflows/document-emblems.yml'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/download-institution-emblems.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-document-emblems
          path: public/emblems/
          if-no-files-found: error
