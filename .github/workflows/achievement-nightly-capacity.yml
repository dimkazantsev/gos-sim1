name: Nightly achievements bounded 100-player SQL
on:
  push:
    branches: ["perf/visibility-presence-comics-20261125"]
    paths:
      - 'docs/performance/achievement-nightly-capacity-candidate.sql'
      - 'scripts/achievement-nightly-database-check.cjs'
      - '.github/workflows/achievement-nightly-capacity.yml'
permissions:
  contents: read
concurrency:
  group: achievement-nightly-capacity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/achievement-nightly-database-check.cjs
