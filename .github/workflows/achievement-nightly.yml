name: Nightly achievements
on:
  push:
    branches: [main]
    paths:
      - 'components/game/Achievements.tsx'
      - 'components/game/achievementPreview.ts'
      - 'scripts/achievement-nightly-*.cjs'
      - 'scripts/achievement-preview-check.cjs'
      - 'supabase/migrations/*achievement_nightly_snapshots.sql'
      - '.github/workflows/achievement-nightly.yml'
  pull_request:
    paths:
      - 'components/game/Achievements.tsx'
      - 'scripts/achievement-nightly-*.cjs'
      - 'supabase/migrations/*achievement_nightly_snapshots.sql'
      - '.github/workflows/achievement-nightly.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/achievement-nightly-client-check.cjs
      - run: node scripts/achievement-nightly-database-check.cjs
      - run: node scripts/achievement-preview-check.cjs
