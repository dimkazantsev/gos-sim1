name: Generate competency event migrations
on:
  push:
    branches: [feat/event-bank-competency-20261010]
    paths:
      - 'content/events-v3-authority.json'
      - 'content/events-legal-2026.json'
      - 'scripts/build-competency-event-migration.py'
      - '.github/workflows/event-competency-generate.yml'
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate SQL
        run: python scripts/build-competency-event-migration.py
      - name: Commit missing migration batches to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/2026101014*_legal_event_competency_*.sql
          if ! git diff --cached --quiet; then
            git commit -m "build(event): materialize 150 reviewed legal case migrations"
            git push
          fi
