name: Budget simulator verification
on:
  push:
    branches: [main, "codex/budget-amendments-*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bderfrcfuhnutuoyudje.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/budget-simulator-math-check.cjs
      - run: npm run design:preview
      - run: node scripts/budget-simulator-browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-simulator-responsive-screenshots
          path: .design-review/screenshots/budget-simulator-*.png
          if-no-files-found: ignore
          retention-days: 7
