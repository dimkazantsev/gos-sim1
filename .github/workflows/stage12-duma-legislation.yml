name: ГОС.ID · Этап 12 и заседания Государственной Думы
on:
  pull_request:
    paths:
      - 'components/game/LegislativeSessionLab.tsx'
      - 'scripts/stage12-work-packages-check.cjs'
      - 'scripts/stage12-auto-agenda-check.cjs'
      - 'scripts/stage12-canonical-duma-agenda-check.cjs'
      - 'scripts/stage12-edit-agenda-check.cjs'
      - 'supabase/migrations/*stage12_duma_agenda_edit.sql'
      - 'components/game/InstitutionRegistrationPanel.tsx'
      - 'app/2026-stage12-synced-agenda.css'
      - 'supabase/migrations/*stage12_canonical_duma_agenda.sql'
      - 'supabase/migrations/*stage12_auto_duma_draft_agenda.sql'
      - 'components/game/Stage12BillPackages.tsx'
      - 'components/game/Stage12BillPackages.module.css'
      - 'components/game/StageArtifacts.tsx'
      - 'scripts/stage12-bill-packages-check.cjs'
      - 'scripts/stage12-package-layout-check.cjs'
      - 'app/2026-bill-dossier-design.css'
      - 'scripts/stage12-bill-dossier-design-check.cjs'
      - 'app/layout.tsx'
      - 'components/game/LegislativeSessionLab.module.css'
      - 'components/game/GovernanceStageWorkspace.tsx'
      - 'supabase/migrations/*stage12_duma_rpc_active_window_guard.sql'
      - 'scripts/stage12-duma-guard-check.cjs'
      - 'scripts/stage12-duma-layout-check.cjs'
      - '.github/workflows/stage12-duma-legislation.yml'
  push:
    branches: [main]
    paths:
      - 'components/game/LegislativeSessionLab.tsx'
      - 'scripts/stage12-work-packages-check.cjs'
      - 'scripts/stage12-auto-agenda-check.cjs'
      - 'scripts/stage12-canonical-duma-agenda-check.cjs'
      - 'scripts/stage12-edit-agenda-check.cjs'
      - 'supabase/migrations/*stage12_duma_agenda_edit.sql'
      - 'components/game/InstitutionRegistrationPanel.tsx'
      - 'app/2026-stage12-synced-agenda.css'
      - 'supabase/migrations/*stage12_canonical_duma_agenda.sql'
      - 'supabase/migrations/*stage12_auto_duma_draft_agenda.sql'
      - 'components/game/Stage12BillPackages.tsx'
      - 'components/game/Stage12BillPackages.module.css'
      - 'components/game/StageArtifacts.tsx'
      - 'scripts/stage12-bill-packages-check.cjs'
      - 'scripts/stage12-package-layout-check.cjs'
      - 'app/2026-bill-dossier-design.css'
      - 'scripts/stage12-bill-dossier-design-check.cjs'
      - 'app/layout.tsx'
      - 'components/game/LegislativeSessionLab.module.css'
      - 'components/game/GovernanceStageWorkspace.tsx'
      - 'supabase/migrations/*stage12_duma_rpc_active_window_guard.sql'
      - 'scripts/stage12-duma-guard-check.cjs'
      - 'scripts/stage12-duma-layout-check.cjs'
      - '.github/workflows/stage12-duma-legislation.yml'
permissions:
  contents: read
jobs:
  stage12:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/stage12-duma-guard-check.cjs
      - run: node scripts/stage12-bill-packages-check.cjs
      - run: npm run typecheck
      - name: Stage 12 responsive layout (Chrome)
        run: |
          for browser in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$browser" ]; then echo "CHROME_BIN=$browser" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "Chrome not found" >&2
          exit 1
      - run: node scripts/stage12-duma-layout-check.cjs
      - run: node scripts/stage12-work-packages-check.cjs
      - run: node scripts/stage12-auto-agenda-check.cjs
      - run: node scripts/stage12-canonical-duma-agenda-check.cjs
      - run: node scripts/stage12-edit-agenda-check.cjs
      - run: node scripts/stage12-package-layout-check.cjs
      - run: node scripts/stage12-bill-dossier-design-check.cjs
