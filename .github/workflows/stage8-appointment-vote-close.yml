name: ГОС.ID · Назначение Председателя и завершение голосований
on:
  pull_request:
    paths:
      - 'components/game/VotesView.tsx'
      - 'supabase/migrations/20261020095000_presidential_appointment_vote_completion_guard.sql'
      - 'scripts/stage8-appointment-vote-completion-check.cjs'
      - 'supabase/migrations/20261021152000_preserve_president_permissions_on_minister_appointment.sql'
      - 'scripts/stage9-president-incumbent-rights-check.cjs'
      - 'supabase/migrations/20261021130140_activate_stage9_after_approved_structure.sql'
      - 'scripts/stage9-access-16-stages-check.cjs'
      - 'supabase/migrations/20261021123915_stage8_government_structure_presidential_act_route.sql'
      - 'scripts/stage8-government-structure-decree-route-check.cjs'
      - '.github/workflows/stage8-appointment-vote-close.yml'
  push:
    branches: [main]
    paths:
      - 'components/game/VotesView.tsx'
      - 'supabase/migrations/20261020095000_presidential_appointment_vote_completion_guard.sql'
      - 'scripts/stage8-appointment-vote-completion-check.cjs'
      - 'supabase/migrations/20261021152000_preserve_president_permissions_on_minister_appointment.sql'
      - 'scripts/stage9-president-incumbent-rights-check.cjs'
      - 'supabase/migrations/20261021130140_activate_stage9_after_approved_structure.sql'
      - 'scripts/stage9-access-16-stages-check.cjs'
      - 'supabase/migrations/20261021123915_stage8_government_structure_presidential_act_route.sql'
      - 'scripts/stage8-government-structure-decree-route-check.cjs'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bderfrcfuhnutuoyudje.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/stage8-appointment-vote-completion-check.cjs
      - run: node scripts/stage9-president-incumbent-rights-check.cjs
      - run: node scripts/stage9-access-16-stages-check.cjs
      - run: node scripts/stage8-government-structure-decree-route-check.cjs
      - run: node scripts/government-nomination-auto-votes-check.cjs
      - run: node scripts/gd-session-attendance-check.cjs
      - run: node scripts/procedural-vote-auto-close-check.cjs
      - run: node scripts/vote-office-grants-check.cjs
      - run: node scripts/stage-decision-vote-document-chain-check.cjs
      - run: npm run typecheck
