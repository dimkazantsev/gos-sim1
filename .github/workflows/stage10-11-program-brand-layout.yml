name: ГОС.ID · Оформление государственных программ
on:
  pull_request:
    paths:
      - 'components/game/StateProgramLab.tsx'
      - 'components/game/StateProgramEditor.tsx'
      - 'components/game/StageForms.module.css'
      - 'scripts/state-program-brand-layout-check.cjs'
      - 'scripts/state-program-brand-responsive-browser-check.cjs'
      - '.github/workflows/stage10-11-program-brand-layout.yml'
  push:
    branches: [main]
    paths:
      - 'components/game/StateProgramLab.tsx'
      - 'components/game/StateProgramEditor.tsx'
      - 'components/game/StageForms.module.css'
      - 'scripts/state-program-brand-layout-check.cjs'
      - '.github/workflows/stage10-11-program-brand-layout.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/state-program-brand-layout-check.cjs
      - name: Find Chrome
        run: |
          for binary in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium; do
            if test -x "$binary"; then echo "CHROME_BIN=$binary" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "Chrome is required for stages 10–11 layout checks" >&2
          exit 1
      - run: node scripts/state-program-brand-responsive-browser-check.cjs
      - run: node scripts/stage10-ministry-team-rights-check.cjs
      - run: npm run typecheck
