name: ГОС.ID · Обучение: Контраст И Прокрутка
on:
  pull_request:
    paths:
      - 'components/game/GuidedTour.tsx'
      - 'components/game/GuidedTour.module.css'
      - 'scripts/guided-tour-dock-browser-check.cjs'
      - '.github/workflows/guided-tour-mobile-regression.yml'
  push:
    branches: [main]
    paths:
      - 'components/game/GuidedTour.tsx'
      - 'components/game/GuidedTour.module.css'
      - 'scripts/guided-tour-dock-browser-check.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bderfrcfuhnutuoyudje.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/guided-tour-check.cjs
      - run: node scripts/guided-tour-dock-browser-check.cjs
