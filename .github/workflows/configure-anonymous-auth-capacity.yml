name: 'ГОС.ID · Пропускная способность Auth 150 новых участников'
on:
  pull_request:
    paths:
      - '.github/workflows/configure-anonymous-auth-capacity.yml'
      - 'scripts/configure-100-anonymous-auth-rate.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-anonymous-auth-capacity.yml'
      - 'scripts/configure-100-anonymous-auth-rate.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gos-auth-rate-limit-config
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/configure-100-anonymous-auth-rate.cjs
  configure:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOS_SUPABASE_PROJECT_REF: bderfrcfuhnutuoyudje
      GOS_ANONYMOUS_RATE_TARGET: '150'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current Auth configuration, raise ONLY anonymous_users if needed, verify
        run: node scripts/configure-100-anonymous-auth-rate.cjs
